apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: souvik
  title: Example Node.js Template
  description: A template
spec:
  owner: user:guest
  type: service

  parameters:
    - title: Provide details
      required:
        - name
        - email
        - comments
      properties:
        name:
          title: Component Name
          type: string
          description: Unique name of the component
          ui:autofocus: true
        email:
          title: User Email
          type: string
          format: email
          description: Your email for tracking
        comments:
          title: Commit Message
          type: string
          description: Message to use in the Git commit

  steps:
    - id: fetch-base
      name: Fetch Template Base
      action: fetch:template
      input:
        url: ./content
        values:
          name: ${{ parameters.name }}
          email: ${{ parameters.email }}

    - id: write-userdata-yaml
      name: Create YAML with User Data
      action: fs:write
      input:
        path: ./user-data.yaml
        content: |
          name: "${{ parameters.name }}"
          email: "${{ parameters.email }}"
          comments: "${{ parameters.comments }}"

    - id: create-pull-request
      name: Create Pull Request
      action: github:pull-request:create
      input:
        repoUrl: github.com?owner=Souvik4002&repo=Basic-Programme
        branchName: feature/${{ parameters.name }}
        title: "PR for ${{ parameters.name }}"
        description: |
          This PR was created automatically from Backstage for:
          - **Name**: ${{ parameters.name }}
          - **Email**: ${{ parameters.email }}
        sourcePath: "."
        commitMessage: ${{ parameters.comments }}
        targetBranch: main

  output:
    links:
      - title: View Pull Request
        url: ${{ steps['create-pull-request'].output.pullRequestUrl }}
